server:
  port: 8080

spring:
  application:
    name: training-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地数据库：先用【创建数据库源码】建库，再改这里的用户名密码
    url: jdbc:mysql://localhost:3306/training_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    time-zone: GMT+8

mybatis-plus:
  configuration:
    # 下划线字段自动映射驼峰（class_name -> className）
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，便于排查
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除统一配置（配合实体上的 @TableLogic）
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置：与后端1统一。此密钥需和后端1完全一致，否则 token 校验不通过。
jwt:
  secret: training-platform-2026-secret-key-please-change-0123456789
  expire-hours: 24
