spring.application.name=demo2
server.port=8080

# ===================== MySQL 数据源（密码改成你自己的） =====================
# useUnicode/characterEncoding 保证中文不乱码；serverTimezone 保证时间不差 8 小时
spring.datasource.url=jdbc:mysql://localhost:3306/training_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456

# ===================== 用户与权限模块自定义配置 =====================
# token 签名密钥，必须不少于 32 个字符；这是交付前必须替换的配置项
app.jwt.secret=training-platform-user-auth-secret-key-2026
# token 有效期（分钟）
app.jwt.expire-minutes=120
# 首次启动自动插入 admin / 123456 账号，初始化完成后建议改成 false
app.init-admin=true

# 排查 SQL 与权限问题时打开
logging.level.com.util.demo2=debug
